# Pi OS ships Storage=volatile (/usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf)
# to spare the SD card. That cost us the only evidence of the 2026-10-04 overnight Wi-Fi
# drop: the power cycle that fixed it erased the log of why it happened. Persist it,
# capped so the card never fills. Named 50- so it sorts after, and overrides, the 40- file.
[Journal]
Storage=persistent
SystemMaxUse=64M
