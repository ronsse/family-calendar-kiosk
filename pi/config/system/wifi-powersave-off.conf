# The Pi's Broadcom radio (brcmfmac) ships with power save ON, and power save is the
# best-known cause of a Pi dropping off Wi-Fi overnight and not coming back. A wall
# plugged into the mains saves nothing worth having by sleeping its radio.
# Applies to every connection whose own powersave is "default" — including the
# netplan-generated one cloud-init writes, so it survives a netplan regenerate.
[connection]
wifi.powersave = 2
